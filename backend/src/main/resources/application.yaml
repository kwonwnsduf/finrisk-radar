server:
  forward-headers-strategy: native

spring:
  application:
    name: backend
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.finrisk.radar.collector.event,com.finrisk.radar.backtest.event,com.finrisk.radar.financial.event,com.finrisk.radar.risk.event,com.finrisk.radar.document.event,com.finrisk.radar.rag.event,com.finrisk.radar.report.event,com.finrisk.radar.payment.outbox,com.finrisk.radar.fsd.event
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

oauth:
  frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/login}
  code-ttl: ${OAUTH_CODE_TTL:180s}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

app:
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
  payment:
    enabled: ${PAYMENT_ENABLED:false}
    frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL:http://localhost:3000}
    subscription-expiry-delay: ${PAYMENT_SUBSCRIPTION_EXPIRY_DELAY:60s}
    provider:
      base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
      connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
      read-timeout: ${TOSS_READ_TIMEOUT:10s}
    lock:
      ttl: ${PAYMENT_LOCK_TTL:30s}
    recovery:
      fixed-delay: ${PAYMENT_RECOVERY_DELAY:60s}
      stale-after: ${PAYMENT_RECOVERY_STALE_AFTER:60s}
    outbox:
      fixed-delay: ${PAYMENT_OUTBOX_DELAY:1s}
      batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}
    fsd:
      enabled: ${PAYMENT_FSD_ENABLED:true}
      failure-burst:
        window: ${PAYMENT_FSD_FAILURE_WINDOW:10m}
        review-count: ${PAYMENT_FSD_FAILURE_REVIEW_COUNT:5}
        block-count: ${PAYMENT_FSD_FAILURE_BLOCK_COUNT:10}
        redis-ttl: ${PAYMENT_FSD_FAILURE_REDIS_TTL:10m}
        control:
          enabled: ${PAYMENT_FSD_FAILURE_ENABLED:true}
          priority: ${PAYMENT_FSD_FAILURE_PRIORITY:10}
          fail-mode: CLOSED
      same-ip-accounts:
        window: ${PAYMENT_FSD_IP_WINDOW:30m}
        review-count: ${PAYMENT_FSD_IP_REVIEW_COUNT:3}
        block-count: ${PAYMENT_FSD_IP_BLOCK_COUNT:5}
        redis-ttl: ${PAYMENT_FSD_IP_REDIS_TTL:30m}
        control:
          enabled: ${PAYMENT_FSD_IP_ENABLED:true}
          priority: ${PAYMENT_FSD_IP_PRIORITY:20}
          fail-mode: CLOSED
      rapid-order-creation:
        window: ${PAYMENT_FSD_ORDER_WINDOW:5m}
        max-orders: ${PAYMENT_FSD_ORDER_MAX:5}
        redis-ttl: ${PAYMENT_FSD_ORDER_REDIS_TTL:5m}
        control:
          enabled: ${PAYMENT_FSD_ORDER_ENABLED:true}
          priority: ${PAYMENT_FSD_ORDER_PRIORITY:30}
          fail-mode: CLOSED
      metadata:
        require-request-id: ${PAYMENT_FSD_REQUIRE_REQUEST_ID:false}
        require-user-agent: ${PAYMENT_FSD_REQUIRE_USER_AGENT:true}
        missing-decision: ${PAYMENT_FSD_METADATA_DECISION:REVIEW}
        missing-severity: ${PAYMENT_FSD_METADATA_SEVERITY:MEDIUM}
        control:
          enabled: ${PAYMENT_FSD_METADATA_ENABLED:true}
          priority: ${PAYMENT_FSD_METADATA_PRIORITY:40}
          fail-mode: CLOSED
      failure-switch-account:
        failure-window: ${PAYMENT_FSD_SWITCH_FAILURE_WINDOW:10m}
        success-window: ${PAYMENT_FSD_SWITCH_SUCCESS_WINDOW:30m}
        minimum-failures: ${PAYMENT_FSD_SWITCH_MIN_FAILURES:5}
        control:
          enabled: ${PAYMENT_FSD_SWITCH_ENABLED:true}
          priority: ${PAYMENT_FSD_SWITCH_PRIORITY:50}
          fail-mode: OPEN
      immediate-cancel:
        immediate-window: ${PAYMENT_FSD_IMMEDIATE_CANCEL_WINDOW:24h}
        lookback-window: ${PAYMENT_FSD_IMMEDIATE_CANCEL_LOOKBACK:30d}
        review-count: ${PAYMENT_FSD_IMMEDIATE_CANCEL_COUNT:3}
        control:
          enabled: ${PAYMENT_FSD_IMMEDIATE_CANCEL_ENABLED:true}
          priority: ${PAYMENT_FSD_IMMEDIATE_CANCEL_PRIORITY:60}
          fail-mode: OPEN
      cancellation-ratio:
        lookback-window: ${PAYMENT_FSD_CANCEL_RATIO_LOOKBACK:30d}
        minimum-payments: ${PAYMENT_FSD_CANCEL_RATIO_MIN_PAYMENTS:4}
        review-ratio: ${PAYMENT_FSD_CANCEL_RATIO:0.5}
        control:
          enabled: ${PAYMENT_FSD_CANCEL_RATIO_ENABLED:true}
          priority: ${PAYMENT_FSD_CANCEL_RATIO_PRIORITY:70}
          fail-mode: OPEN
      repeated-order-pattern:
        window: ${PAYMENT_FSD_REPEATED_ORDER_WINDOW:24h}
        minimum-orders: ${PAYMENT_FSD_REPEATED_ORDER_MIN:5}
        maximum-paid-ratio: ${PAYMENT_FSD_REPEATED_ORDER_PAID_RATIO:0.4}
        control:
          enabled: ${PAYMENT_FSD_REPEATED_ORDER_ENABLED:true}
          priority: ${PAYMENT_FSD_REPEATED_ORDER_PRIORITY:80}
          fail-mode: OPEN
  seed-risk-scenarios:
    enabled: ${SEED_RISK_SCENARIOS_ENABLED:false}
  seed-reit-risk-scenarios:
    enabled: ${SEED_REIT_RISK_SCENARIOS_ENABLED:false}
  market-data:
    yahoo:
      base-url: ${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
  dart:
    base-url: ${DART_BASE_URL:https://opendart.fss.or.kr}
    api-key: ${DART_API_KEY:}
  documents:
    naver:
      base-url: ${NAVER_NEWS_BASE_URL:https://naverapihub.apigw.ntruss.com}
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    scheduler:
      enabled: ${DOCUMENT_COLLECTION_SCHEDULER_ENABLED:false}
      cron: ${DOCUMENT_COLLECTION_SCHEDULER_CRON:0 0 * * * *}
    recalculation-retry-delay: ${DOCUMENT_RECALCULATION_RETRY_DELAY:60000}
    recalculation-max-attempts: ${DOCUMENT_RECALCULATION_MAX_ATTEMPTS:5}
  rag:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
      batch-size: ${OPENAI_EMBEDDING_BATCH_SIZE:32}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_READ_TIMEOUT:30s}
  llm:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_LLM_MODEL:}
      connect-timeout: ${OPENAI_LLM_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_LLM_READ_TIMEOUT:60s}
      max-output-tokens: ${OPENAI_LLM_MAX_OUTPUT_TOKENS:2000}
      max-context-characters: ${OPENAI_LLM_MAX_CONTEXT_CHARACTERS:24000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
          additional-path: server:/readyz
          show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
