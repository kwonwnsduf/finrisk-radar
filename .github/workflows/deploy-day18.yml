name: Deploy Day18 to AWS

on:
  workflow_dispatch:

concurrency:
  group: finrisk-day18-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "422060263480"
  BACKEND_REPOSITORY: finrisk-backend
  FRONTEND_REPOSITORY: finrisk-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Require public build configuration
        env:
          TOSS_WIDGET_CLIENT_KEY: ${{ vars.TOSS_WIDGET_CLIENT_KEY }}
        run: test -n "$TOSS_WIDGET_CLIENT_KEY"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::422060263480:role/finrisk-day18-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          TOSS_WIDGET_CLIENT_KEY: ${{ vars.TOSS_WIDGET_CLIENT_KEY }}
        run: |
          set -Eeuo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_tag="sha-$(git log -1 --format=%H -- backend frontend)"

          if ! aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids "imageTag=$image_tag" >/dev/null 2>&1
          then
            docker build \
              --provenance=false \
              -f backend/Dockerfile \
              -t "$registry/$BACKEND_REPOSITORY:$image_tag" \
              backend
            docker push "$registry/$BACKEND_REPOSITORY:$image_tag"
          fi

          if ! aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids "imageTag=$image_tag" >/dev/null 2>&1
          then
            docker build \
              --provenance=false \
              -f frontend/Dockerfile \
              --build-arg NEXT_PUBLIC_API_BASE_URL= \
              --build-arg NEXT_PUBLIC_OAUTH_BASE_URL= \
              --build-arg "NEXT_PUBLIC_TOSS_CLIENT_KEY=$TOSS_WIDGET_CLIENT_KEY" \
              -t "$registry/$FRONTEND_REPOSITORY:$image_tag" frontend
            docker push "$registry/$FRONTEND_REPOSITORY:$image_tag"
          fi

      - name: Resolve immutable digests and EC2 target
        id: release
        run: |
          set -Eeuo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_tag="sha-$(git log -1 --format=%H -- backend frontend)"
          image_query='imageDetails[0].imageDigest'

          backend_digest=$(aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids "imageTag=$image_tag" \
            --query "$image_query" \
            --output text)
          frontend_digest=$(aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids "imageTag=$image_tag" \
            --query "$image_query" \
            --output text)

          instance_query='Reservations[0].Instances[0]'
          instance_id=$(aws ec2 describe-instances \
            --filters \
              Name=tag:Name,Values=finrisk-day18-app \
              Name=instance-state-name,Values=running \
            --query "$instance_query.InstanceId" \
            --output text)
          public_ip=$(aws ec2 describe-instances \
            --instance-ids "$instance_id" \
            --query "$instance_query.PublicIpAddress" \
            --output text)

          test "$instance_id" != "None"
          {
            echo "backend_image=$registry/$BACKEND_REPOSITORY@$backend_digest"
            echo "frontend_image=$registry/$FRONTEND_REPOSITORY@$frontend_digest"
            echo "instance_id=$instance_id"
            echo "public_ip=$public_ip"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.release.outputs.frontend_image }}
          INSTANCE_ID: ${{ steps.release.outputs.instance_id }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            ping_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            [[ "$ping_status" == "Online" ]] && break
            if [[ "$attempt" == "30" ]]; then
              echo "EC2 did not become SSM Online" >&2
              exit 1
            fi
            sleep 10
          done

          script_path=infra/aws/scripts/deploy-day18-via-ssm.sh
          script_url="https://raw.githubusercontent.com/"
          script_url+="$GITHUB_REPOSITORY/$GITHUB_SHA/$script_path"

          remote_script=/tmp/finrisk-day18-deploy.sh
          remote_command="curl -fsSL '$script_url' -o $remote_script"
          remote_command+=" && chmod 0700 $remote_script"
          remote_command+=" && sudo $remote_script"
          remote_command+=" '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '$GITHUB_SHA'"

          jq -n \
            --arg command "$remote_command" \
            '{commands: [$command]}' > ssm-parameters.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          result_query='{Status:Status,Output:StandardOutputContent,'
          result_query+='Error:StandardErrorContent}'
          for attempt in $(seq 1 90); do
            command_status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)
            case "$command_status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query "$result_query" \
                  --output json
                exit 1
                ;;
            esac
            if [[ "$attempt" == "90" ]]; then
              echo "SSM deployment did not finish within 15 minutes" >&2
              exit 1
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "$result_query" \
            --output json

      - name: Verify public health
        env:
          PUBLIC_IP: ${{ steps.release.outputs.public_ip }}
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "http://$PUBLIC_IP/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "http://$PUBLIC_IP/actuator/health"
