apiVersion: v1
kind: ConfigMap
metadata:
  name: finrisk-config
  namespace: finrisk
data:
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://host.k3d.internal:5432/finrisk
  POSTGRES_USER: finrisk
  REDIS_HOST: host.k3d.internal
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: host.k3d.internal:39092
  OAUTH_FRONTEND_REDIRECT_URI: http://localhost/login
  PAYMENT_FRONTEND_BASE_URL: http://localhost
  PAYMENT_ENABLED: "true"
  DOCUMENT_COLLECTION_SCHEDULER_ENABLED: "false"
  DOCUMENT_RECALCULATION_SCHEDULER_ENABLED: "false"
  MARKET_DATA_CRON_LOOKBACK_DAYS: "10"
  NAVER_NEWS_BASE_URL: https://naverapihub.apigw.ntruss.com
  OPENAI_BASE_URL: https://api.openai.com
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_EMBEDDING_DIMENSIONS: "1536"
  OPENAI_EMBEDDING_BATCH_SIZE: "32"
  OPENAI_LLM_CONNECT_TIMEOUT: 5s
  OPENAI_LLM_READ_TIMEOUT: 60s
  OPENAI_LLM_MAX_OUTPUT_TOKENS: "2000"
  OPENAI_LLM_MAX_CONTEXT_CHARACTERS: "24000"
  AWS_REGION: ap-northeast-2
