apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: finrisk
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: finrisk-radar
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: finrisk-radar
        finrisk.io/metrics: spring
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: finrisk/backend:day20
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finrisk-config
            - secretRef:
                name: finrisk-app-secrets
          env:
            - name: APP_WORKER_ENABLED
              value: "true"
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "true"
            - name: JAVA_OPTS
              value: -Xms128m -Xmx448m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
