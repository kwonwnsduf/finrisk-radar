apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: finrisk
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: finrisk-radar
spec:
  replicas: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: finrisk-radar
        finrisk.io/metrics: spring
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: finrisk/backend:day20
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finrisk-config
            - secretRef:
                name: finrisk-app-secrets
          env:
            - name: APP_WORKER_ENABLED
              value: "false"
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
            - name: JAVA_OPTS
              value: -Xms128m -Xmx448m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
