apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finrisk
  namespace: finrisk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
