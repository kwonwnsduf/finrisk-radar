apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-data
  namespace: finrisk
  labels:
    app.kubernetes.io/name: market-data
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: finrisk-radar
spec:
  schedule: "0 8 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-data
            app.kubernetes.io/component: cron
            app.kubernetes.io/part-of: finrisk-radar
        spec:
          restartPolicy: Never
          containers:
            - name: market-data
              image: finrisk/backend:day20
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: finrisk-config
                - secretRef:
                    name: finrisk-app-secrets
              env:
                - name: TZ
                  value: Asia/Seoul
                - name: APP_CRON_TASK
                  value: market-data
                - name: APP_WORKER_ENABLED
                  value: "false"
                - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
                  value: "false"
                - name: SPRING_TASK_SCHEDULING_ENABLED
                  value: "false"
                - name: DOCUMENT_COLLECTION_SCHEDULER_ENABLED
                  value: "false"
                - name: DOCUMENT_RECALCULATION_SCHEDULER_ENABLED
                  value: "false"
                - name: SPRING_MAIN_WEB_APPLICATION_TYPE
                  value: none
                - name: JAVA_OPTS
                  value: -Xms96m -Xmx352m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  cpu: 500m
                  memory: 640Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
