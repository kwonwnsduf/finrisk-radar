name: finrisk-radar-day19-app

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${CONTAINER_LOG_GROUP_NAME}
    awslogs-create-group: "false"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    mem_limit: 640m
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: >-
        -Xms128m -Xmx384m
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError
      APP_WORKER_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      REDIS_HOST: ${RUNTIME_HOST}
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${RUNTIME_HOST}:9092
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CONTAINER_LOG_GROUP_NAME}
        awslogs-create-group: "false"
        awslogs-stream: application-backend-${INSTANCE_ID}
    networks: [finrisk]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    mem_limit: 160m
    environment:
      BACKEND_API_URL: http://backend:8080
      NODE_OPTIONS: --max-old-space-size=112
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CONTAINER_LOG_GROUP_NAME}
        awslogs-create-group: "false"
        awslogs-stream: application-frontend-${INSTANCE_ID}
    networks: [finrisk]

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    mem_limit: 32m
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      <<: *awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${CONTAINER_LOG_GROUP_NAME}
        awslogs-create-group: "false"
        awslogs-stream: application-nginx-${INSTANCE_ID}
    networks: [finrisk]

networks:
  finrisk:
    driver: bridge
